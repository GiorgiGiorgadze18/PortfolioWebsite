<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF3316">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:; style-src 'self' 'unsafe-inline'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <title>Tsero · Interactive demo</title>
  <link rel="icon" href="assets/images/tsero_launcher.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="demo.js"></script>
</head>
<body>
  <div id="app" class="app tone-red">
    <div class="status-bar" aria-hidden="true">
      <span>10:00</span>
      <svg viewBox="0 0 48 14" width="46" height="14" fill="currentColor">
        <path d="M0 12 11 1v11zM16 5a11 11 0 0 1 15 0l-7.5 7zM38 2h7v11h-7zM40 0h3v2h-3z"/>
      </svg>
    </div>
    <main id="screen" class="screen" tabindex="-1">
      <div class="splash"><img alt="Tsero" src="assets/images/logo_white.png"></div>
    </main>
    <nav id="dock" class="dock" aria-label="Main navigation" hidden></nav>
    <span class="home-indicator" aria-hidden="true"></span>
    <noscript>This interactive demo requires JavaScript.</noscript>
  </div>
</body>
</html>
